<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tablet Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; height: 100vh; overflow: hidden; }
        img { width: 100%; height: 100%; object-fit: contain; }
        #stats {
            position: fixed; top: 10px; right: 10px;
            color: #0f0; font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="stats">0 FPS</div>
    <img id="screen" src="" alt="">
    
    <script>
        const img = document.getElementById('screen');
        const stats = document.getElementById('stats');
        let frames = 0, lastTime = performance.now();
        
        function updateFps() {
            frames++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                stats.textContent = frames + ' FPS';
                frames = 0; lastTime = now;
            }
        }
        
        async function loadFrame() {
            try {
                const resp = await fetch('/frame.jpg?t=' + Date.now(), {cache: 'no-store'});
                if (resp.ok) {
                    const blob = await resp.blob();
                    img.src = URL.createObjectURL(blob);
                    updateFps();
                }
            } catch (e) {}
            requestAnimationFrame(loadFrame);
        }
        
        loadFrame();
    </script>
</body>
</html>
